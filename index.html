<!doctype html>
<html lang="en" class="h-full w-full overflow-hidden">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      /* Polyfill ES2022 Object.hasOwn for older browsers and webviews */
      if (typeof Object.hasOwn !== 'function') {
        Object.defineProperty(Object, 'hasOwn', {
          value: function (object, property) {
            if (object == null) {
              throw new TypeError('Cannot convert undefined or null to object');
            }
            return Object.prototype.hasOwnProperty.call(Object(object), property);
          },
          configurable: true,
          enumerable: false,
          writable: true,
        });
      }
      try {
        var ua = navigator.userAgent || '';
        var isIOS =
          /iPad|iPhone|iPod/.test(ua) ||
          (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        if (isIOS) {
          var rootEl = document.documentElement;
          rootEl.classList.add('ios-device');
          var isStandalone =
            window.navigator.standalone === true ||
            (window.matchMedia &&
              (window.matchMedia('(display-mode: standalone)').matches ||
                window.matchMedia('(display-mode: fullscreen)').matches));
          if (isStandalone) {
            rootEl.classList.add('ios-standalone');
          }
          if (window.innerHeight > 0) {
            rootEl.style.setProperty('--ios-app-height', Math.round(window.innerHeight) + 'px');
          }
        }
      } catch (e) {}
    </script>
    <title>FMZ Friends Mobile Zone - POS Pro</title>
    <meta name="description" content="Complete point of sale, IMEI inventory tracking, repair ticketing, khata ledger, expense tracking, and financial analytics for mobile shops." />
    <meta property="og:title" content="FMZ Friends Mobile Zone - POS Pro" />
    <meta property="og:description" content="Complete point of sale, IMEI inventory tracking, repair ticketing, khata ledger, expense tracking, and financial analytics for mobile shops." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FMZ POS" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="h-full w-full overflow-hidden bg-slate-50 text-slate-800 font-sans antialiased selection:bg-purple-600 selection:text-white m-0 p-0 select-none">

  </body>
</html>
